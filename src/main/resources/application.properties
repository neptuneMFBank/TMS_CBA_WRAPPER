# Spring Boot (Actuator, REST APIs)
server.port=8500
spring.profiles.active=live

spring.application.name=cbawrapper

# Issuer bank lookup for pos_transaction_requests (BinLookupService)
binlist.enabled=true
binlist.url=https://binlist.io/lookup/
binlist.cron=0 */2 * * * *
binlist.batch-size=200
binlist.request-delay-ms=1000
binlist.health.healthy-threshold=95
binlist.health.degraded-threshold=80
